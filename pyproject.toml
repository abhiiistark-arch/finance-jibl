[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sachit-commission"
version = "0.1.0"
description = "Commission PDF to Excel (Flask)"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "pandas>=2.0.0",
    "pdfplumber>=0.10.0",
    "pymupdf>=1.24.0",
    "openpyxl>=3.1.0",
    "fuzzywuzzy>=0.18.0",
    "python-Levenshtein>=0.21.0",
]

[project.scripts]
app = "app.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
